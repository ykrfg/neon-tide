<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Tide</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; background: #050914; box-shadow: 0 0 64px rgba(38, 226, 255, 0.12); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Neon Tide: move with WASD, aim with the mouse, hold the mouse button to shoot, dash with Shift, and defend the crystal Core through eight waves"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
